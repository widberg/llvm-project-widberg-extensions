name: Widberg Release

on:
  push:
    tags:
      - 'widberg-*'

permissions: {}

concurrency:
  group: widberg-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Publish
    runs-on: windows-latest
    permissions:
      contents: write # Required to create/edit releases and upload release assets.
    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false

    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Build
      run: |
           cmake -S llvm -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra;lld" -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_TARGETS_TO_BUILD="X86"
           cmake --build build --config RelWithDebInfo --target vt_gen
           cmake --build build --config RelWithDebInfo --target clang clangd clang-format clang-tidy lld llvm-lib llvm-ar llvm-rc

    - name: Package
      run: |
           cd build/bin/
           7z a ../../bin.zip clang-cl.exe clangd.exe clang-format.exe clang-tidy.exe lld-link.exe llvm-lib.exe llvm-ar.exe llvm-rc.exe

    - name: Create or Update Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.ref_name }}
        RELEASE_NAME: Release ${{ github.ref }}
      shell: bash
      run: |
           set -euo pipefail
           if gh release view "$TAG_NAME" >/dev/null 2>&1; then
             gh release edit "$TAG_NAME" \
               --title "$RELEASE_NAME" \
               --draft=false \
               --prerelease=false
           else
             gh release create "$TAG_NAME" \
               --title "$RELEASE_NAME" \
               --draft=false \
               --prerelease=false
           fi

    - name: Upload Archive to Release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
           set -euo pipefail
           gh release upload "${GITHUB_REF_NAME}" "bin.zip#${GITHUB_REF_NAME}-windows-x86_64-${GITHUB_SHA}.zip" --clobber
