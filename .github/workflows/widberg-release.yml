name: Widberg Release

on:
  push:
    tags:
      - 'widberg-*'

permissions: {}

concurrency:
  group: widberg-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Publish
    runs-on: windows-latest
    permissions:
      contents: write # Required to create/edit releases and upload release assets.
    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false

    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Install NSIS
      run: choco install nsis --no-progress -y

    - name: Compute Package Name
      shell: bash
      run: |
           set -euo pipefail
           package_name="${GITHUB_REF_NAME}-windows-x86_64-${GITHUB_SHA}"
           llvm_version="$(bash llvm/utils/release/get-llvm-version.sh)"
           echo "WIDBERG_PACKAGE_NAME=${package_name}" >> "$GITHUB_ENV"
           echo "WIDBERG_PACKAGE_PATH=build/${package_name}.exe" >> "$GITHUB_ENV"
           echo "WIDBERG_RELEASE_ASSET_NAME=${package_name}.exe" >> "$GITHUB_ENV"
           echo "WIDBERG_LLVM_VERSION=${llvm_version}" >> "$GITHUB_ENV"

    - name: Build libxml2
      shell: pwsh
      run: |
           $libxmlVersion = "2.9.12"
           $libxmlArchive = "libxml2-v$libxmlVersion.tar.gz"
           $libxmlUrl = "https://gitlab.gnome.org/GNOME/libxml2/-/archive/v$libxmlVersion/$libxmlArchive"
           $libxmlSha256 = "98bfa7a9a5e2a75638422050740448ee9f02bf4dc2075c9822d7747d5ff9e617"
           $libxmlSourceDir = "libxml2-v$libxmlVersion"
           $libxmlBuildDir = "libxmlbuild"
           $libxmlInstallDir = Join-Path (Get-Location) "$libxmlBuildDir/install"
           Invoke-WebRequest -Uri $libxmlUrl -OutFile $libxmlArchive
           $actualHash = (Get-FileHash -Algorithm SHA256 $libxmlArchive).Hash.ToLowerInvariant()
           if ($actualHash -ne $libxmlSha256) {
             throw "libxml2 checksum mismatch: expected $libxmlSha256, got $actualHash"
           }
           tar -xzf $libxmlArchive --exclude "test/*"
           cmake -S $libxmlSourceDir -B $libxmlBuildDir -G Ninja `
             -DCMAKE_BUILD_TYPE=Release `
             -DCMAKE_INSTALL_PREFIX="$libxmlInstallDir" `
             -DBUILD_SHARED_LIBS=OFF `
             -DLIBXML2_WITH_C14N=OFF `
             -DLIBXML2_WITH_CATALOG=OFF `
             -DLIBXML2_WITH_DEBUG=OFF `
             -DLIBXML2_WITH_DOCB=OFF `
             -DLIBXML2_WITH_FTP=OFF `
             -DLIBXML2_WITH_HTML=OFF `
             -DLIBXML2_WITH_HTTP=OFF `
             -DLIBXML2_WITH_ICONV=OFF `
             -DLIBXML2_WITH_ICU=OFF `
             -DLIBXML2_WITH_ISO8859X=OFF `
             -DLIBXML2_WITH_LEGACY=OFF `
             -DLIBXML2_WITH_LZMA=OFF `
             -DLIBXML2_WITH_MEM_DEBUG=OFF `
             -DLIBXML2_WITH_MODULES=OFF `
             -DLIBXML2_WITH_OUTPUT=ON `
             -DLIBXML2_WITH_PATTERN=OFF `
             -DLIBXML2_WITH_PROGRAMS=OFF `
             -DLIBXML2_WITH_PUSH=OFF `
             -DLIBXML2_WITH_PYTHON=OFF `
             -DLIBXML2_WITH_READER=OFF `
             -DLIBXML2_WITH_REGEXPS=OFF `
             -DLIBXML2_WITH_RUN_DEBUG=OFF `
             -DLIBXML2_WITH_SAX1=ON `
             -DLIBXML2_WITH_SCHEMAS=OFF `
             -DLIBXML2_WITH_SCHEMATRON=OFF `
             -DLIBXML2_WITH_TESTS=OFF `
             -DLIBXML2_WITH_THREADS=ON `
             -DLIBXML2_WITH_THREAD_ALLOC=OFF `
             -DLIBXML2_WITH_TREE=ON `
             -DLIBXML2_WITH_VALID=OFF `
             -DLIBXML2_WITH_WRITER=OFF `
             -DLIBXML2_WITH_XINCLUDE=OFF `
             -DLIBXML2_WITH_XPATH=OFF `
             -DLIBXML2_WITH_XPTR=OFF `
             -DLIBXML2_WITH_ZLIB=OFF `
             -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
           cmake --build $libxmlBuildDir --config Release --target install
           $libxmlInstallUnix = $libxmlInstallDir.Replace('\', '/')
           echo "WIDBERG_LIBXML2_INCLUDE_DIR=$libxmlInstallUnix/include/libxml2" >> $env:GITHUB_ENV
           echo "WIDBERG_LIBXML2_LIBRARY=$libxmlInstallUnix/lib/libxml2s.lib" >> $env:GITHUB_ENV

    - name: Configure Package Build
      shell: pwsh
      run: |
           cmake -S llvm -B build -G Ninja `
             -DCMAKE_BUILD_TYPE=Release `
             -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra;lld" `
             -DLLVM_ENABLE_ASSERTIONS=ON `
             -DLLVM_TARGETS_TO_BUILD="X86" `
             -DLLVM_ENABLE_LIBXML2=FORCE_ON `
             -DCLANG_ENABLE_LIBXML2=OFF `
             -DLIBXML2_INCLUDE_DIR="$($env:WIDBERG_LIBXML2_INCLUDE_DIR)" `
             -DLIBXML2_LIBRARIES="$($env:WIDBERG_LIBXML2_LIBRARY)" `
             -DCMAKE_C_FLAGS="-DLIBXML_STATIC" `
             -DCMAKE_CXX_FLAGS="-DLIBXML_STATIC" `
             -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON `
             -DCPACK_GENERATOR=NSIS `
             -DCPACK_PACKAGE_VENDOR="Widberg" `
             -DPACKAGE_VERSION="$($env:WIDBERG_LLVM_VERSION)" `
             -DCPACK_PACKAGE_VERSION="$($env:GITHUB_REF_NAME)" `
             -DCPACK_PACKAGE_INSTALL_DIRECTORY="LLVM Widberg" `
             -DCPACK_PACKAGE_INSTALL_REGISTRY_KEY="LLVMWidberg" `
             -DCPACK_NSIS_MODIFY_PATH=ON `
             -DCPACK_NSIS_ENABLE_UNINSTALL_BEFORE_INSTALL=ON `
             -DCPACK_PACKAGE_FILE_NAME="$($env:WIDBERG_PACKAGE_NAME)"

    - name: Build Package
      run: |
           cmake --build build --config Release --target package

    - name: Create or Update Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.ref_name }}
        RELEASE_NAME: Release ${{ github.ref_name }}
      shell: bash
      run: |
           set -euo pipefail
           if gh release view "$TAG_NAME" >/dev/null 2>&1; then
             gh release edit "$TAG_NAME" \
               --title "$RELEASE_NAME" \
               --draft=false \
               --prerelease=false
           else
             gh release create "$TAG_NAME" \
               --title "$RELEASE_NAME" \
               --draft=false \
               --prerelease=false
           fi

    - name: Upload Installer to Release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
           set -euo pipefail
           gh release upload "${GITHUB_REF_NAME}" "${WIDBERG_PACKAGE_PATH}#${WIDBERG_RELEASE_ASSET_NAME}" --clobber
