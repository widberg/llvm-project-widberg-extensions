name: Widberg Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  nightly-release:
    name: Update Nightly Release
    runs-on: ubuntu-24.04
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      actions: read # Required to discover and download artifacts from widberg-build.
      contents: write # Required to retag nightly and manage release assets.

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download latest build artifacts
        id: artifact_check
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p nightly-artifacts

          run_id="$(gh run list \
            --workflow widberg-build.yml \
            --branch "$DEFAULT_BRANCH" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [ -z "$run_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No successful widberg-build runs found on branch $DEFAULT_BRANCH."
            exit 0
          fi

          artifact_index="nightly-artifacts/.artifact-index"
          if ! gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --paginate \
            --jq '.artifacts[] | select(.expired == false) | "\(.id)\t\(.name)"' \
            > "$artifact_index"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Failed to list artifacts from run $run_id."
            exit 0
          fi

          mapfile -t run_artifacts < "$artifact_index"
          rm -f "$artifact_index"

          if [ "${#run_artifacts[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No artifacts found in run $run_id."
            exit 0
          fi

          download_failed=false
          for artifact in "${run_artifacts[@]}"; do
            artifact_id="${artifact%%$'\t'*}"
            artifact_name="${artifact#*$'\t'}"
            artifact_path="nightly-artifacts/${artifact_name}"

            if ! gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$artifact_path"; then
              echo "error downloading ${artifact_name}"
              download_failed=true
              break
            fi
          done

          if [ "$download_failed" = true ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Failed to download artifacts from run $run_id."
            exit 0
          fi

          mapfile -d '' artifacts < <(find nightly-artifacts -type f -print0)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No downloadable artifact files found in run $run_id."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf 'Found artifacts from run %s:\n' "$run_id"
            printf '%s\n' "${artifacts[@]}"
          fi

      - name: Ensure nightly release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly \
              --title "Nightly" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Update nightly tag
        if: ${{ steps.artifact_check.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -F sha="$GITHUB_SHA" \
              -F force=true
          else
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs" \
              -F ref="refs/tags/nightly" \
              -F sha="$GITHUB_SHA"
          fi

      - name: Replace nightly release assets
        if: ${{ steps.artifact_check.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t existing_assets < <(gh release view nightly --json assets --jq '.assets[].name')
          for asset in "${existing_assets[@]}"; do
            gh release delete-asset nightly "$asset" --yes
          done

          mapfile -d '' artifacts < <(find nightly-artifacts -type f -print0)
          gh release upload nightly "${artifacts[@]}" --clobber
          gh release edit nightly \
            --title "Nightly" \
            --prerelease
